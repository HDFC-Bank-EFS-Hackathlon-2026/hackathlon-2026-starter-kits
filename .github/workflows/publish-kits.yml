name: Publish participant kits

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-kits.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public starter-kit repo
        uses: actions/checkout@v4

      - name: Download validated participant artifact
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-3550-8211-94cb-91f0e177042c/raw?se=2026-09-26T01%3A40%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=feebec17-3e7d-5e49-96be-c792d6969f3a&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T19%3A35%3A15Z&ske=2026-09-26T19%3A35%3A15Z&sks=b&skv=2026-02-06&sig=fzdJ5T00MTJ67BgRu%2BCa0HyBMV%2Buo3CjLSSVuT24/Qg%3D"
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/hackathlon-kits.zip
          unzip -q /tmp/hackathlon-kits.zip -d /tmp/hackathlon-kits

      - name: Publish participant-safe files
        run: |
          rm -rf kits public-briefs
          cp -a /tmp/hackathlon-kits/kits ./kits
          cp -a /tmp/hackathlon-kits/public-briefs ./public-briefs
          find kits public-briefs -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Commit published kits
        run: |
          git config user.name "HDFC Hackathlon Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add kits public-briefs SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish Hackathlon 2026 participant starter kits"
            git push
          fi
